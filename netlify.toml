# Netlify configuration. See docs/deployment.md.
[build]
  # Validation runs first so a template that fails the catalog checks is never published.
  command = "pnpm validate && pnpm build"
  publish = "apps/web/dist"

[build.environment]
  NODE_VERSION = "24"

# Single-page app fallback: let the app handle addresses such as /projects/attendance-system.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/template-bundles/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
