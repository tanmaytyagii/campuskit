name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A newer push to a pull request cancels its older run; every commit on main keeps a complete run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  checks:
    name: Validate, lint, type-check, test and build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      # Third-party action, pinned to a commit; it uses the pnpm version in package.json.
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm validate
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  # package.json promises Node.js 22.18 or newer: the tools load the workspace packages'
  # TypeScript directly, which older Node.js 22 releases can't do.
  oldest-node:
    name: Tests and build on Node.js 22.18 (oldest supported)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@v7
        with:
          node-version: 22.18.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm build

  e2e:
    name: End-to-end tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @campuskit/web exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      # Also kept when every test passed, so a flaky test's failed attempt (traces included) can be read.
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: apps/web/playwright-report
          retention-days: 7

  # The same end-to-end tests in desktop Firefox and WebKit (Safari's engine).
  e2e-browsers:
    name: End-to-end tests (${{ matrix.browser }})
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        browser: [firefox, webkit]
    env:
      CAMPUSKIT_E2E_BROWSERS: ${{ matrix.browser }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @campuskit/web exec playwright install --with-deps ${{ matrix.browser }}
      - run: pnpm --filter @campuskit/web exec playwright test --project=${{ matrix.browser }}
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: playwright-report-${{ matrix.browser }}
          path: apps/web/playwright-report
          retention-days: 7

  changed-templates:
    name: Find the templates to verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      templates: ${{ steps.pick.outputs.templates }}
      run: ${{ steps.pick.outputs.run }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # the diff needs the base branch
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Pull requests verify only the templates they can affect; pushes to main verify everything.
      - id: pick
        name: Pick templates
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          if [ "$EVENT_NAME" = "pull_request" ]; then
            pnpm --silent changed-templates "origin/$BASE_REF"
          else
            echo "templates=" >> "$GITHUB_OUTPUT"
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

  generated-projects:
    name: Generated projects (${{ matrix.os }})
    needs: changed-templates
    if: needs.changed-templates.outputs.run == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: pnpm install --frozen-lockfile
      # An empty list verifies every template. The ids are split into separate words with
      # `read -a` (no glob expansion). Failures are also written as annotations and to the job
      # summary (see the script); the full output is kept as an artifact when the job fails.
      - run: |
          read -ra templates <<< "$TEMPLATES"
          pnpm verify:generated "${templates[@]}" 2>&1 | tee verify-generated.log
        shell: bash
        env:
          CAMPUSKIT_PYTHON: python
          TEMPLATES: ${{ needs.changed-templates.outputs.templates }}
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: verify-generated-${{ matrix.os }}
          path: verify-generated.log
          retention-days: 14
