name: Bug report
description: Something on the website, in the generator or in a template doesn't work.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a problem. **Security problems should not be reported here**: follow SECURITY.md in the repository instead.
  - type: dropdown
    id: area
    attributes:
      label: Where is the problem?
      options:
        - Website (gallery, project pages, documentation)
        - Generator or the downloaded ZIP
        - Learning center (report builder)
        - Student Attendance System template
        - Personal Expense Tracker template
        - Student Result Analyzer template
        - Something else
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: Include the exact error message if there is one.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open …
        2. Click …
        3. See the error
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect to happen?
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Browser and operating system
      description: For template problems, also give your Node.js or Python version (`node --version`, `python --version`).
      placeholder: Chrome 140 on Windows 11, Node.js 24.11
    validations:
      required: true
  - type: textarea
    id: extra
    attributes:
      label: Screenshots or other details
      description: Don't include personal information such as real student names or marks.
